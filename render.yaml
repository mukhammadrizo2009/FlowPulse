services:
  # Backend API Web Service
  - type: web
    name: flowpulse-backend
    env: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn core.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DATABASE_URL
        fromDatabase:
          name: flowpulse-db
          property: connectionString
      - key: FRONTEND_URL
        fromService:
          type: web
          name: flowpulse-frontend
          property: host

  # Daily Notification Reminders Cron Job
  - type: cron
    name: flowpulse-daily-reminders
    env: python
    region: oregon
    plan: free
    schedule: "0 7 * * *" # Runs daily at 07:00 UTC
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py send_reminders"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flowpulse-db
          property: connectionString

  # Frontend React SPA Static Site
  - type: web
    name: flowpulse-frontend
    env: static
    region: oregon
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: "npm install --legacy-peer-deps && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: flowpulse-backend
          property: url

databases:
  - name: flowpulse-db
    region: oregon
    plan: free
