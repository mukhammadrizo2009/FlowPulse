<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="habitGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="stickerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Sticker Squircle -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#habitGrad)" filter="url(#stickerShadow)" />
  <rect x="5.5" y="5.5" width="53" height="53" rx="14.5" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Habit Checkmark Sticker Path -->
  <path
    d="M19 33.5 L27.5 42 L45 23"
    stroke="#ffffff"
    stroke-width="6.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Habit Streak Sparkle / Accent -->
  <circle cx="45" cy="19" r="3.5" fill="#38bdf8" />
</svg>